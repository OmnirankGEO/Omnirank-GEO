<style>

:root{--bg:#2b0f4a;--acc:#ff3d8b;--pink:#ff3d8b;--cyan:#16d6e8;--yel:#ffe14d}

.hz{font-weight:900;color:var(--yel);-webkit-text-stroke:14px #2b0f4a;paint-order:stroke fill;letter-spacing:-2px;line-height:1.1;text-shadow:0 12px 0 #2b0f4a}
.hz.w{color:#fff}
.card{position:absolute;left:80px;width:800px;padding:36px 44px;border-radius:40px;background:#fff;border:10px solid #2b0f4a;box-shadow:16px 16px 0 #2b0f4a;color:#2b0f4a}
.card .lb{position:absolute;left:-30px;top:-46px;width:110px;height:110px;border-radius:50%;border:8px solid #2b0f4a;display:flex;align-items:center;justify-content:center;font-size:66px;font-weight:900;color:#fff}
.card .tx{font-size:66px;font-weight:900;line-height:1.25;margin-left:60px}

.vs{position:absolute;left:400px;top:735px;width:200px;height:200px;border-radius:50%;background:var(--yel);border:10px solid #2b0f4a;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:900;color:#2b0f4a;font-style:italic;z-index:5}
.stk{position:absolute;filter:drop-shadow(0 16px 16px rgba(0,0,0,.3))}
.mark{position:absolute;font-size:76px;font-weight:900}
.doc{position:absolute;left:80px;width:800px;padding:46px;background:#fff;border-radius:30px;border:10px solid #2b0f4a;color:#2b0f4a;font-size:56px;font-weight:900;line-height:1.6;box-shadow:16px 16px 0 #2b0f4a}
.hl{position:relative;display:inline-block}
.hl i{position:absolute;left:-6px;right:-6px;top:10%;bottom:10%;background:rgba(255,61,139,.35);transform-origin:0 50%;border-radius:8px}
.hl s{text-decoration:none;position:relative}
.hl s::after{content:"";position:absolute;left:-4px;right:-4px;top:52%;height:8px;background:#e00;transform:scaleX(var(--k,0));transform-origin:0 50%}
.chip{display:inline-block;background:var(--cyan);color:#2b0f4a;padding:2px 20px;border-radius:14px;border:6px solid #2b0f4a}
