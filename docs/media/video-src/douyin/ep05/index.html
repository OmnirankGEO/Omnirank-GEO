<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第 5 集 · AI 到底推荐你没有</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="../base.css">
<style>
/* 体育比分直播风:球场夜景 + 斜切字幕条 + 黄色高亮 */
:root{--bg:#06112a;--acc:#ffd400;--navy:#0a1a3f;--red:#e10600}
.k{font-weight:900;letter-spacing:-2px;line-height:1.05}
.bar{position:absolute;display:flex;align-items:center;font-weight:900;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);padding:0 70px}
.y{background:var(--acc);color:#0a0a0a}.n{background:var(--navy);color:#fff}.w{background:#fff;color:#0a0a0a}.rd{background:var(--red);color:#fff}
.live{position:absolute;left:90px;top:220px;display:flex;gap:0;font-weight:900;font-size:40px}
.live b{background:var(--red);color:#fff;padding:6px 20px}.live span{background:#fff;color:#000;padding:6px 20px}
.live i{display:inline-block;width:16px;height:16px;border-radius:50%;background:#fff;margin-right:10px;vertical-align:middle}
.plate{position:absolute;left:90px;width:800px;height:130px;font-size:60px;justify-content:space-between}
.plate em{font-style:normal;font-size:38px;background:var(--acc);color:#000;padding:6px 18px}
.row{position:absolute;left:90px;width:800px;height:120px;display:flex;align-items:center;font-size:54px;font-weight:900;background:rgba(10,26,63,.92);color:#fff;border-left:14px solid #3a4f80}
.row .r i{font-style:normal;position:absolute;left:0;right:0}.row .r .v{opacity:0}
.row .r{position:relative;height:72px;line-height:72px;width:120px;text-align:center;font-size:60px;color:var(--acc)}
.row.me{background:var(--acc);color:#000;border-left-color:var(--red)}.row.me .r{color:var(--red)}
.foot{position:absolute;left:90px;font-size:30px;font-weight:700;color:rgba(255,255,255,.7)}
.card{position:absolute;left:110px;width:780px;background:#fff;color:#111;padding:40px 44px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card h4{font-size:52px;font-weight:900;line-height:1.25}
.card p{font-size:32px;color:#666;margin-top:16px;font-weight:700}
.stamp{position:absolute;font-weight:900;font-size:56px;color:var(--red);border:8px solid var(--red);padding:6px 26px;background:rgba(255,255,255,.92)}
#badge span{background:var(--red)}
svg.ch path{fill:none;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

</div>
  <canvas id="grain" width="1080" height="1920"></canvas>
