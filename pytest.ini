[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# 🔴 `scripts` 是 2026-09-03 加的(#39)。加之前:`scripts/` 下有 19 个判据文件、
# 547 个收集项,文件名匹配 `test_*.py` 却**不在收集根内** —— 默认 pytest 一个都收不到。
# 它们唯一的「接线」是散文:全仓搜文件名,13 个零引用,另 14 个被提到的全是注释,
# 零条调用。同期 `scripts/` 下另有 8 个叫 `test_*` 却零判据的手工脚本,
# 已改名移到 `scripts/manual/` —— 它们不是判据,进收集范围只会被 import 执行。
testpaths = tests scripts
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: 真 PG 集成测试 (需要 docker network / CI 服务)
    browser: 真浏览器判据 (需要 node + frontend/node_modules + playwright chromium)。
        环境不具备时这些用例**红**而不是 skip —— skip 在汇总里长得像"没问题",
        而它其实是"没验"。要显式不跑请用 -m "not browser",
        让"我们决定不跑它"留在命令行里,而不是藏在一个静默的 skip 里。
