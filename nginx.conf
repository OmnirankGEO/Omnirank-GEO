# === 速率限制 ===
# 普通 API: 10 req/s per IP（突发允许 20）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# SSE/长耗时: 2 req/s per IP（突发允许 5）
limit_req_zone $binary_remote_addr zone=sse_limit:10m rate=2r/s;
# 连接数限制: 每 IP 最多 50 并发连接
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# === [WO_303 · Review 09-28] 认宿主机传来的客户端 IP ===
# 宿主机 nginx 经 127.0.0.1:8001 / 8002 端口映射进容器,容器看到的源地址恒为 Docker 网关(Deploy 09-28 实测:geo_agentscope_default 网关,access.log 全是它)。
# 不认的话 $remote_addr 全是网关 ⇒ 转给后端的 X-Real-IP / X-Forwarded-For 全是同一个地址,控制台按 IP 的限频全站共用一个桶,本文件的 limit_conn / limit_req 也一样。
# 只信那一个网关地址(不写整个 /16:同网络里的 db / redis / cron 容器不该被当成可信来源);信任范围只在 http 级定这一处。
# 宿主机那层也要先认 ESA 回源再传 X-Real-IP,两层都改好后端才拿得到真实客户端 IP。
# 判据:tests/nginx_real_ip_2026_09_28(私网、非全网段、两行都在、server 里不许另写)。
set_real_ip_from 172.20.0.1;
real_ip_header X-Real-IP;

# === [WO_279] 转给后端的原协议 ===
# 容器只听明文 80,$scheme 恒为 http。后端(uvicorn 信任本机 nginx 发来的代理头)按 X-Forwarded-Proto 定协议,
# 拿它拼尾斜杠 307 跳转、分享 / 报价 / 资料链接,并决定 Cookie 要不要 Secure。
# 这里取边缘(ESA / 前置代理)传来的原协议;没传、或不是 http / https 这两个值(不分大小写),才退回 $scheme。
# 🔴 每个 proxy_pass 到 backend 的 location 都必须自己设 X-Forwarded-Proto 头,值取本 map 的输出变量,不许用 $scheme
#    (location 里只要写了任何一条 proxy_set_header,就不再继承上一级的 —— 所以只能逐个写)。
#    判据:tests/nginx_backend_redirect_scheme_2026_09_23。
#    注释里故意不抄那条指令的原文:原文一出现在注释里,按字符串找「第一处」的毒 / grep / 计数就会先落在注释上(WO_279b)。
map $http_x_forwarded_proto $forwarded_proto {
    default   $scheme;
    ~*^https$ https;
    ~*^http$  http;
}

upstream backend {
    ip_hash;
    server 127.0.0.1:8000;
}

server {
    # [WO_293] 显式 default_server:nginx 的兜底块是「该端口第一个 server 块」或标了 default_server 的那个,
    #   `server_name _` 本身不兜底;以后在本块之前再加别的 server 块时,不标这个,其余 Host 会全落到那一块。
    listen 80 default_server;
    server_name _;

    # [WO_278] 跳转一律发相对 Location。容器只听明文 80,不知道自己在 TLS(ESA / 前置代理)后面:
    #   默认 absolute_redirect on 会把 `return 302 /s`、`rewrite … redirect`,以及 `location /api/`
    #   这类「前缀以 / 结尾 + proxy_pass」对无尾斜杠请求的自动 301,全拼成 `http://<Host>/…` ——
    #   把 https 访客推回明文(也正是能直打源站 80 口的那类请求)。相对 Location 由浏览器按
    #   当前页的 scheme 与 host 解析,永远留在访客进来的那条协议上。
    #   🔴 以后若某条跳转必须写绝对地址,scheme 用 $forwarded_proto(WO_279 的 map:边缘原协议,缺了退回 $scheme)生成,
    #      不许写死 http://,也别直接用 $http_x_forwarded_proto(边缘没带时为空,会拼出 ://host)。
    absolute_redirect off;
    port_in_redirect off;

    # [WO_279] 后端自己拼的同域绝对 http:// Location(Starlette 尾斜杠 307 等)改写成相对路径,
    #   浏览器按当前页的协议解析 —— 不依赖边缘有没有带 X-Forwarded-Proto。https:// 与外域的 Location 不动。
    #   server 级写了 proxy_redirect,各 location 就不再生成隐式的 `proxy_redirect default`(http://backend/ → /);
    #   那条本来也匹配不到:每个 location 都 `proxy_set_header Host $host`,后端不会拼出 http://backend/。
    proxy_redirect http://$host/ /;

    # === 安全头 ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 全局连接数限制
    limit_conn conn_limit 50;

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # 全局上传限制（个别端点可覆盖）
    client_max_body_size 50M;

    # 前端静态文件
    # CDN 模式：取消注释下方 return 301，让用户从 CDN 加载
    # 非 CDN 模式（默认）：从本地 dist 目录提供
    # 社媒新版独立入口：用户只暴露 /s，旧 /social 和 /social-studio 做入口隐藏跳转。
    # 注意：/api/social/* 是后端 API，不会命中这里。
    location = /social { return 302 /s; }
    location ^~ /social/ { rewrite ^/social(/.*)$ /s$1 redirect; }
    location = /social-studio { return 302 /s; }
    location ^~ /social-studio/ { rewrite ^/social-studio(/.*)$ /s$1 redirect; }

    # [WO_277 · 2026-09-23] 开源署名条款写死的项目主页 https://omnirank.top/opensource
    #   (开源附加条件:再分发 / 部署时不得移除指向它的链接)。此前没有这条 location ⇒ 落 SPA 兜底 ⇒ 前端 404 页。
    #   仓库建好前 302 到临时说明页(frontend/public/opensource.html,vite 拷进 dist 根);建仓后只把目标改成仓库 URL。
    #   absolute_redirect off:源站只听 80,默认会把 Location 拼成 http://…,边缘后面的 https 用户会被带回 http。
    #   判据:tests/security/test_opensource_homepage_route.py
    location = /opensource  { absolute_redirect off; return 302 /opensource.html; }
    location = /opensource/ { absolute_redirect off; return 302 /opensource.html; }

    location / {
        root /app/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        # CDN 模式：取消注释下一行（需在 VITE_CDN_URL 配置 CDN 域名后构建）
        # return 301 https://cdn.yourdomain.com$request_uri;
    }

    # index.html 和 SW 不缓存（确保每次拿最新）
    location = /index.html {
        root /app/frontend/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # Phase 08.2 (CTO-15.23 2026-05-04) · P0 · 砍 vite-plugin-pwa 配套
    # 已 install 的老 Service Worker 主动注销 · 防止隐私模式白屏
    # 老 SW 拿到 410 后浏览器自动 unregister · 避免污染新版部署
    location = /sw.js { return 410; }
    location = /registerSW.js { return 410; }
    location = /workbox-b51dd497.js { return 410; }
    location ~ ^/workbox-[a-f0-9]+\.js$ { return 410; }
    location = /manifest.webmanifest { return 410; }

    # 带 hash 的静态资源长缓存
    # [CTO-15.23 2026-05-20 P0 救火] 加 try_files $uri =404 防 SPA fallback 死循环
    # 同事报:用户 Chrome 报告 index-XXX.js 一直循环重定向(部署不完整时新 HTML 引用的 JS
    # 在 prod 不存在)· 没 try_files=404 时 nginx 可能落到 location / 的 try_files fallback
    # /index.html · 返 HTML 给 Chrome 的 JS 请求 → MIME mismatch + nosniff → 浏览器反复重试
    # 修法:/assets/ 明确 =404 · 让缺失的 JS 直接 404 不 fallback · Chrome 显示明确 error
    # 同时给浏览器明确信号该 chunk 不存在(SW unregister + 提示用户刷新)
    # [WO_NO_SILENT_RELOAD_DIRTY_GUARD 2026-08-16 ③] 真根:部署后旧 chunk 不许立刻 404。
    #   病史:每次部署替换 /assets ⇒ 还停在老页面的用户,懒加载一个新路由就 404,
    #   于是触发 errorReporter 的静默 reload —— 表单被刷掉。
    #   ①② 是止血(不问自取改成问一句),这一条才是把病源掐掉:
    #   vite 是 content-hash 命名,新旧资产**天然可并存**,旧 chunk 继续可用,
    #   用户在自然导航或点 banner 时才升级,chunk 404 从源头消失。
    #   归档目录由 start.sh 在每次启动时增量填充,蓝绿两槽共享同一个宿主目录
    #   —— 共享是必须的:切槽之后另一槽的资产同样要能被老页面取到。
    location /assets/ {
        root /app/frontend/dist;
        try_files $uri @assets_archive;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location @assets_archive {
        # 🔴 [返修 R1 · Deploy 二次发车 NO-GO 2026-08-17] 这里原本是 `alias /app/assets_archive/;`
        #   —— **`alias` 在 named location(@name)里是 nginx 硬性禁止**,不是版本差异、不是环境差异:
        #   `[emerg] the "alias" directive cannot be used inside the named location` ⇒ nginx 拒启
        #   ⇒ green 容器永不 healthy ⇒ 部署自止。与上一趟的 git 死因**同族**:
        #   两者都是「只有在目标容器里才会被解释执行」的东西,本机全绿一律不算数。
        #   `root` 在 named location 里合法,且落点与原来逐字相同:
        #     $uri = /assets/index-XXX.js  ⇒  root + $uri = /app/assets_archive/assets/index-XXX.js
        #   与 start.sh 的 ARCHIVE_DIR(`/app/assets_archive/assets`)严丝合缝 —— 交付时已独立核过。
        root /app/assets_archive;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 让 Deploy 与复审能一眼看出这次是回落命中的(判据 ③ 靠它区分"新资产"与"归档资产")
        add_header X-Omnirank-Assets "archive" always;
    }

    # 用户上传的图片/文件(头像、文章配图等)· nginx 直接服务,不走 uvicorn
    # [2026-06-02 修复] 此前完全无 /uploads location → /uploads/avatars/* 落 location / 的 SPA
    # [2026-06-02 收窄 · 2026-06-22 增白标 Logo] 只开放「本就该公开」的子目录:文章配图 + 用户头像 + 白标 Logo。其余一律 404。
    # root /app 让 /uploads/avatars/x.jpg → /app/uploads/avatars/x.jpg(docker volume 挂载点)。
    # try_files =404:不存在直接 404,不再 fallback 成 SPA HTML(避免 broken image)。
    # 🔴 /uploads/corpus/(社媒语料)及其它子目录默认不公开(末尾 location /uploads/ 兜底 404)。
    #    nginx 取最长前缀匹配:article-images/avatars 比 /uploads/ 长,优先命中。
    location /uploads/article-images/ {
        root /app;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        access_log off;
    }
    location /uploads/avatars/ {
        root /app;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        access_log off;
    }
    # [2026-06-22 Deploy] 白标 Logo 上传(referral_api.upload_whitelabel_logo)落 uploads/whitelabel-logos/,
    #   白标对外要公开 → 仿 avatars 放行;root /app + try_files =404;长前缀优先于下方兜底。
    location /uploads/whitelabel-logos/ {
        root /app;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        access_log off;
    }
    # 营销物料工厂成品图(对外可公开 · 与 article-images 同约定)
    location /uploads/marketing-materials/ {
        root /app;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        access_log off;
    }
    # 其它 /uploads/ 子目录(corpus 社媒语料 / KYC 等)一律不公网访问
    location /uploads/ {
        return 404;
    }

    # === SSE/长耗时端点（严格限速 2r/s） ===

    # 导出端点（PDF/PPTX生成）
    location ~ ^/api/(diagnosis|reports)/\d+/export/ {
        limit_req zone=sse_limit burst=2 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    # 报价生成（metaso批量+LLM估算）
    location ~ ^/api/keyword-selection/[^/]+/generate-quote {
        limit_req zone=sse_limit burst=2 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
    }

    # M3 诊断 → 方案书生成（generate_batch_quote ~50s · LLM + metaso）
    # 老 P0.5c · CTO-15.7 上线 · 前端 axios 已配 5min · nginx 这里给 600s 兜底
    # 修 P1-3 (2026-04-27): 默认 60s 会让用户看到 504 但后端已扣费 + 落 quote
    location ~ ^/api/diagnosis/[^/]+/generate-quote {
        limit_req zone=sse_limit burst=2 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
    }

    # 单词AI审计（LLM审计+AI深探）
    location ~ ^/api/keyword-selection/[^/]+/audit-keyword/ {
        limit_req zone=sse_limit burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # 关键词扩展（LLM+5118双引擎）
    location = /api/keywords/expand {
        limit_req zone=sse_limit burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    # 线下报价（5118+秘塔+LLM审计）
    location = /api/keywords/quote {
        limit_req zone=sse_limit burst=2 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
    }

    # AI自动填写（联网搜索+重试）
    location = /api/diagnosis/autofill {
        limit_req zone=sse_limit burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 180s;
    }

    # 社媒仿写SSE
    location = /api/social/rewrite-stream {
        limit_req zone=sse_limit burst=2 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # [2026-08-01 方案B] 短视频服务端中转上传
    # 背景：渠道存储桶 的 CORS 白名单没有 omnirank.top（bucket 是媒介盒子的，我们改不了）
    #   → 浏览器直传永远失败 → 改成 浏览器 → 我们 → 渠道存储（服务器间无 CORS）。
    # 🔴 三项缺一不可：
    #   1. client_max_body_size 1100M · 全局是 50M，不放开这里 1GB 视频**进都进不来**（413）
    #   2. proxy_request_buffering off · 不让 nginx 先把 1GB 落盘缓冲完再转发
    #      （否则既吃 nginx 磁盘，又让用户白等一倍时间，还破坏后端的流式转发）
    #   3. 超时给足 · 1GB 走公网上传 + 我们再转投 OSS，600s 不够
    location = /api/meijiehezi/short-video/upload-video {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_request_buffering off;
        client_max_body_size 1100M;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 语料上传（大文件+ASR转录）
    location = /api/social/corpus/upload {
        limit_req zone=sse_limit burst=2 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
        client_max_body_size 100M;
    }

    # 对话模式v2 SSE
    # v1.7.6.2 P0-3 真根治(同 /quick-generate-stream)· 补齐 SSE 完整配置防 disconnect 丢失
    location = /api/content/chat {
        limit_req zone=sse_limit burst=5 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 快速生成SSE
    # v1.7.6.2 P0-3 真根治(2026-05-24 老板深度诊断):
    # · 原配置只有 proxy_buffering off · client abort 后 disconnect 不传 backend
    # · upstream HTTP/1.0(proxy_http_version 默认)keep-alive 异常 · uvicorn 收不到 EOF
    # · 补齐 4 项让 nginx 正确关 upstream + propagate disconnect:
    #   1. proxy_http_version 1.1 + Connection '' · 让 backend 看到正常 close 信号
    #   2. proxy_request_buffering off · 请求体不缓冲(防 nginx hold connection 等读完)
    #   3. chunked_transfer_encoding on · SSE 流式传输标准
    # 对齐 line 306 regex catch-all 已有的完整 SSE 配置
    location = /api/content/quick-generate-stream {
        limit_req zone=sse_limit burst=5 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 社媒仿写（视频获取+转录+多轮LLM）
    location ~ ^/api/social/rewrite {
        limit_req zone=sse_limit burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    # 博主拆解SSE
    # v1.7.6.2 P0-3 真根治(同 /quick-generate-stream)· 补齐 SSE 完整配置防 disconnect 丢失
    location = /api/research/user-breakdown-stream {
        limit_req zone=sse_limit burst=2 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 研究中心（视频采集+转录+AI分析+博主拆解）
    location ~ ^/api/research/(collect|user-breakdown|comment-analysis) {
        limit_req zone=sse_limit burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
    }

    # === 社媒 · 文件上传 + AI 解析(PDF vision + LLM 字段提取)===
    # 2026-05-18:48 页扫描 PDF + 整页 qwen3.6-flash vision(并发 10 · ~35s)+ LLM 解析(deepseek-v4-flash 60s · fallback reasoner 120s)
    # 老板原话"上传广东乐居 PDF 504":通用 /api/ catch-all 60s 不够 · vision pipeline 必然打穿
    # 覆盖 3 个端点(同样走 _extract_upload_text → _extract_pdf_with_vision):
    #   · /api/products/ai-parse(产品资料提 4 字段)
    #   · /api/profile/upload-and-parse-file(社媒画像 KB 上传)
    #   · /api/social/profile/knowledge/upload(社媒语料库上传)
    location ~ ^/api/(products/ai-parse|profile/upload-and-parse-file|social/profile/knowledge/upload)$ {
        limit_req zone=sse_limit burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        client_max_body_size 60M;
    }

    # 2026-05-21 v1.3 类 Kimi chat 参考资料预备栏:
    # · parse-file 走 vision / PDF 解析(同 vision pipeline · 必然打穿 60s 默认)· 后端 90s timeout 兜底
    # · parse-url 走 video.py · short JSON 但走同 regex 简化配置
    # · 单文件 50MB(后端硬限) · nginx 给 60MB buffer
    location ~ ^/api/content/chat-attachment/(parse-file|parse-url)$ {
        limit_req zone=sse_limit burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        client_max_body_size 60M;
    }

    # [2026-06-22 fix · 客户资料上传 504] /api/knowledge/upload-file(BrandDetailPage + WritingHall 客户资料上传)
    #   走 PDF 解析 + 向量入库(LanceDB) + AI 整理 pipeline · 必然 >60s · 通用 /api/ catch-all 60s 打穿
    #   后端实际成功(chunks 已入库)但 nginx 504 · 前端收 504 误报"上传失败" · 客户重复上传(prod 实证两次 chunks=4)
    location ~ ^/api/knowledge/upload(-file)?$ {
        limit_req zone=sse_limit burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        client_max_body_size 60M;
    }

    # === Phase 4 · C 端异步 GEO 任务轮询端点（CTO-15.5 · 2026-04-20）===
    # 轻量 JSON · 2s/次 · 不需要长超时,也不能被上面 /api/geo-plan/ catch-all 的 600s 拖累
    # ^~ 前缀匹配优先于下方的 regex catch-all,命中此 location 后不再继续搜 regex
    # 匹配 /api/geo-plan/task/{id} 和 /api/geo-plan/task/{id}/cancel 两条路径
    # 老板已批复 S1 系统设置改动（PRD Section 5）· 为前端 2s 轮询 task 状态让路
    location ^~ /api/geo-plan/task/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # SSE/长耗时 catch-all（诊断、写作、Agent对话、建档等）
    # c-end/chat: v3.2 C 端 SSE，必须关 buffering 防 HTTP/2 协议错误
    # v1_3 (CTO-15.1 2026-04-19):
    # - Round 2 P1: content/generate- 覆盖 script / topics / hook 非 stream 长任务
    # - 追加: geo-plan/ 覆盖 full-plan / unlock (one_click_geo_plan 30-60s) 防 504
    # - 追加: brand/auto-fill + content/deep-analyze (AI 联网搜集) 防超时
    location ~ ^/api/(diagnosis/run|writing/|monitoring/run-stream|distill/|settings/health-check|agent/chat|c-end/chat|content/chat|content/generate-|content/quick-generate-stream|content/interview-script-stream|content/deep-analyze|placement/|interview/|geo-plan/|brand/auto-fill) {
        limit_req zone=sse_limit burst=5 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # v3.3 GEO 托管 API（估算+确认充值含 LLM 调用，需要长 timeout + 关 buffering）
    # 2026-05-09: 专家市场对话 · 不是 SSE 但内部多次 LLM 调用(主答 + fallback + revise + identity sanitize)
    # 老板 reported "请求失败,请稍后重试" 根因:走默认 /api/ 60s timeout 不够 LLM 串联耗时 → 504
    # 加独立 location 提到 300s · 与 managed_plan / autofill 一类长 LLM 端点对齐
    location ~ ^/api/advisors/[^/]+/chat$ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    # 2026-04-17 P1-8: 加入独立 location 防走通用 /api/ 的 60s timeout
    location ~ ^/api/managed/ {
        limit_req zone=sse_limit burst=5 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 采访语音WebSocket
    location = /api/interview/voice-stream {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # === 普通 API（标准限速 10r/s） ===
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # WebSocket 反代（超时 900s = 15 分钟，覆盖诊断最长时间）
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # FastAPI 文档
    location /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /redoc {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /openapi.json {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
