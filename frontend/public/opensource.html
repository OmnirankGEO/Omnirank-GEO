<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniRank 开源版 · 全域上榜</title>
<meta name="description" content="OmniRank / 全域上榜 开源版项目主页。开源版本即将发布。">
<style>
  :root { color-scheme: light dark; --fg: #111; --muted: #555; --bg: #fff; --line: #e6e8e3; --brand: #4f8f14; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #eee; --muted: #aaa; --bg: #111; --line: #2a2d28; --brand: #8ed34a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  main { width: 100%; max-width: 520px; padding: 32px 16px; }
  h1 { font-size: 22px; line-height: 1.4; margin: 0 0 12px; }
  p { font-size: 15px; line-height: 1.7; color: var(--muted); margin: 0 0 16px; }
  .contact { border-top: 1px solid var(--line); padding-top: 16px; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>OmniRank / 全域上榜 开源版</h1>
  <p>开源版本即将发布。</p>
  <p class="contact">联系我们:<a href="/feedback">问题反馈</a>(登录后留言) · <a href="https://omnirank.cn/">访问 OmniRank 官网</a></p>
</main>
</body>
</html>
